# Everything this console serves that somebody else wrote: where it was published, pinned to a
# release, and the digest the copy in `src/mainplate/assets/` has to match. `just vendor` fetches
# each one and writes nothing unless every one hashes to what is recorded here, and
# `tests/test_vendored.py` holds the copies on disk against the same table with no network. Bumping
# one is editing the version in its `url`, running `just vendor`, reading the digest it refuses on,
# and recording it here once the file has been looked at.
#
# Each licence is vendored the same way, because it ships in the same directory. The table is keyed
# by the name the file has in `assets/`, and a name here is the whole of what `vendor.py` knows. A
# row with a `member` is that path inside the zip at its `url`, which is how a face published in a
# release archive is a row like a script published as itself; its digest is the member's own.

