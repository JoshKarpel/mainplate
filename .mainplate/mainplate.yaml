# What this repository asks a mainplate session working on it to run.
#
# One plugin, and its path is relative to the worktree root. The key is the whole of its name: a
# session running this one calls it `repository:pre-commit`, prefixes its tool to
# `repo_pre-commit_check` and its leader to `/pre-commit:check`, and holds its settings under that
# qualified name. Nothing here can name an endpoint, a credential or an isolation level, because the
# type this is read into has no field for one.
plugins:
  pre-commit: .mainplate/pre-commit
