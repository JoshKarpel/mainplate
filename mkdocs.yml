site_name: mainplate
site_description: >-
  A chat console over a Pydantic AI agent whose sessions are durable workflows,
  where the checkpoint is the conversation and there is no second copy of what
  was said.
# No `site_url`, deliberately. GitHub Pages serves this under `/mainplate/`, and `mkdocs serve`
# honours that path, so setting it makes `just docs` serve the whole site one directory down: `/`
# redirects and every link a reader types by hand is a 404. What it buys is canonical links and
# absolute sitemap URLs, which is not worth the local build being a different site from the one
# `just docs-build` produces.
repo_url: https://github.com/JoshKarpel/mainplate
repo_name: JoshKarpel/mainplate
copyright: Copyright &copy; Josh Karpel
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: fontawesome/solid/comments
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# A page links to another page's heading often enough here that an unchecked `#anchor` is the way a
# cross-reference rots silently. Under `--strict` these are errors, so a renamed heading fails the
# build rather than leaving a link that lands at the top of the right page.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

hooks:
  - docs/hooks.py

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Philosophy: philosophy.md
  - Design:
      - design/index.md
      - Checkpoints: design/checkpoints.md
      - Endpoints and models: design/endpoints.md
      - What a turn cost: design/cost.md
      - Forking: design/forking.md
      - The composer: design/composer.md
      - The workspace: design/workspace.md
      - What a session is told: design/guidance.md
      - Where a command runs: design/sandbox.md
      - Durability: design/durability.md
      - The console: design/console.md
      - Running it as a service: design/deployment.md
  - Maintaining: maintaining.md
  - Changelog: changelog.md
