[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "mainplate"
version = "0.0.1"
description = "A coding agent that keeps its own sessions: a Pydantic AI agent made durable over a SQLite checkpoint, with a chat console in front of it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Josh Karpel", email = "josh.karpel@gmail.com" },
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    # `-slim` plus the one provider, rather than `pydantic-ai`, which pulls every provider
    # SDK, a CLI, an MCP server, and an evals framework into an environment that uses one
    # of them. Adding a provider is an extra in this list rather than a change to any code.
    "pydantic-ai-slim[anthropic,openai]>=2.33",
    "without-async>=0.0.7",
    "without-asgi>=0.0.7",
    "without-web>=0.0.7",
    "without-html>=0.0.7",
    "without-http>=0.0.7",
    # 0.0.7 for the inbox (`Durable.deliver`, `Run.receive`) and for the `seq` column `load`
    # orders by, which the SQLite store gained in the same release: a checkpoint written by
    # one of these and read by the other is a `load` that fails on a missing column.
    "without-durability>=0.0.7",
    "without-durability-sqlite>=0.0.7",
    # Declared because `exe` imports it, though only `without-http` calls it: reflection lives at a
    # hostname that exists only inside an exe.dev VM, so "not on exe.dev" arrives as h11's own
    # `RemoteProtocolError` as readily as an `OSError`, and discovery catches it by name.
    "h11>=0.16",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "typer>=0.27",
    "markdown>=3.7",
    "nh3>=0.2.18",
    # Declared rather than leant on: it arrives transitively today, but `markup.py` imports it to
    # take the token vocabulary the sanitiser's class allowlist is built from, and a package this
    # depends on for a *security* boundary is not one to inherit by accident.
    "pygments>=2.18",
    "pyyaml>=6.0.3",
]

[project.scripts]
mainplate = "mainplate.main:main"

[project.urls]
Source = "https://github.com/JoshKarpel/mainplate"

[tool.uv]
# Skip releases younger than this when resolving, so a compromised publish has a week to be
# noticed by somebody else before it can reach this machine.
exclude-newer = "7 days"

# `without` is exempt, because the cooldown is defending against nobody here: it is written by the
# same person in a sibling repository, released when this needs something from it, and read as a
# diff rather than trusted as an artifact. Waiting a week for a release cut for us would be the
# whole friction of a path dependency with none of its convenience. What that gives up is real and
# worth saying: if the account publishing `without` were compromised, this is the one dependency
# where nothing would stand between the bad release and the next `uv lock`.
#
# `without-streams` and `without-dag` are here too, though nothing imports them directly: the
# cooldown applies to whatever the graph resolves, so a transitive package left in would hold the
# whole set back to a release that predates it.
[tool.uv.exclude-newer-package]
without-async = false
without-asgi = false
without-web = false
without-http = false
without-html = false
without-streams = false
without-dag = false
without-durability = false
without-durability-sqlite = false

[dependency-groups]
dev = [
    "pytest<10",
    "pytest-asyncio>=1",
    "pytest-cov>=3",
    "pytest-randomly>=3",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3",
    "mypy>=2.3.0",
    "ruff>=0.15.22",
    "pre-commit>=4.4",
    "types-markdown>=3.7",
    "types-pygments>=2.18",
    "watchfiles>=1.2.0",
    "types-pyyaml>=6.0.12.20260815",
    "playwright>=1.62.0",
    # The site generator is part of the one development environment rather than a group of its own,
    # because there is nothing to save by separating them: mypy walks `docs/hooks.py`, which imports
    # MkDocs, so an environment `just test` passes in is one that has it installed anyway.
    #
    # Capped below MkDocs 2.0 deliberately rather than by habit: it removes the plugin system and
    # rewrites theming with no migration path, so `mkdocs-material` stops working on it. The cap
    # goes when there is a version of this stack that runs on it.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7",
]

[tool.pytest.ini_options]
addopts = [
    "-q",
    "-n", "auto",
    "--dist", "worksteal",
    "--strict-markers",
]
testpaths = ["tests"]
asyncio_mode = "auto"

# So `scripts/` imports as a package. The browser tests drive the gallery, and the gallery is
# rendered by the same code `just gallery` runs rather than by a second set of fixtures that
# resembles it.
pythonpath = ["."]

# A per-test timeout so a deadlocked async test fails loudly instead of hanging the suite.
# `thread` works without signals, so it is xdist-safe. Raise it per-test with
# `@pytest.mark.timeout(...)` rather than globally.
timeout = 10
timeout_method = "thread"

filterwarnings = ["error"]

[tool.mypy]
pretty = true
show_error_codes = true

plugins = ["pydantic.mypy"]

files = ["."]

# `workspaces/` is the clones and worktrees a local console makes, which land beside the database and
# so land here whenever `just serve` or `just demo` is run from this directory. They hold *other
# people's* repositories, checked out by a session, so type-checking them is checking somebody else's
# code against this project's settings. `site/` is the built documentation, which carries a copy of
# `docs/hooks.py` and so collides with it by module name. `.gitignore` does not reach mypy, which
# walks the tree itself.
exclude = ["^workspaces/", "^site/"]

check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
disallow_any_generics = true

warn_unused_configs = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_redundant_casts = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120

# A bundled plugin is not part of this package. It is a standalone executable this console runs over
# a pipe, under an `/usr/bin/env python3` shebang, which is whatever interpreter the machine has
# rather than the one `requires-python` pins - so its syntax has to be older than everything else
# here. Without this the formatter rewrites a parenthesized `except` into PEP 758's unparenthesized
# form, which is a `SyntaxError` on anything before 3.14 and therefore a plugin that will not run.
#
# **Only the bundled ones, and `.mainplate/pre-commit` is why the difference is worth knowing.** That
# one is a `uv run --script` shebang with a PEP 723 block naming this project's own Python, so it
# runs on the interpreter this repository pins and needs nothing here. A plugin that says which
# interpreter it wants gets it; these two say `python3` and take what the machine has, which is the
# price of a plugin that must run before `uv` is known to be anywhere.
#
# **A PEP 723 block does not set the linter's target version, which was checked rather than assumed.**
# ruff 0.16 ignores `requires-python` in inline script metadata whether the project's own target is
# set explicitly or inferred, so a bundled plugin carrying one would still be formatted as 3.14.
[tool.ruff.per-file-target-version]
"src/mainplate/plugins/bundled/*" = "py39"

[tool.ruff.lint]
select = [
    "A",     # https://docs.astral.sh/ruff/rules/#flake8-builtins-a
    "ASYNC", # https://docs.astral.sh/ruff/rules/#flake8-async-async
    "B",     # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "BLE",   # https://docs.astral.sh/ruff/rules/#flake8-blind-except-ble
    "C4",    # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "D",     # https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "DTZ",   # https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
    "E",     # https://docs.astral.sh/ruff/rules/#error-e
    "F",     # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "FA",    # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
    "FLY",   # https://docs.astral.sh/ruff/rules/#flynt-fly
    "FURB",  # https://docs.astral.sh/ruff/rules/#refurb-furb
    "G",     # https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
    "I",     # https://docs.astral.sh/ruff/rules/#isort-i
    "ICN",   # https://docs.astral.sh/ruff/rules/#flake8-import-conventions-icn
    "LOG",   # https://docs.astral.sh/ruff/rules/#flake8-logging-log
    "N",     # https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "PERF",  # https://docs.astral.sh/ruff/rules/#perflint-perf
    "PGH",   # https://docs.astral.sh/ruff/rules/#pygrep-hooks-pgh
    "PIE",   # https://docs.astral.sh/ruff/rules/#flake8-pie-pie
    "PLC",   # https://docs.astral.sh/ruff/rules/#convention-plc
    "PLE",   # https://docs.astral.sh/ruff/rules/#error-ple
    "PLW",   # https://docs.astral.sh/ruff/rules/#warning-plw
    "PT",    # https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
    "PTH",   # https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "PYI",   # https://docs.astral.sh/ruff/rules/#flake8-pyi-pyi
    "RET",   # https://docs.astral.sh/ruff/rules/#flake8-return-ret
    "RSE",   # https://docs.astral.sh/ruff/rules/#flake8-raise-rse
    "RUF",   # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    "S307",  # https://docs.astral.sh/ruff/rules/suspicious-eval-usage/
    "SIM",   # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
    "SLF",   # https://docs.astral.sh/ruff/rules/#flake8-self-slf
    "T10",   # https://docs.astral.sh/ruff/rules/#flake8-debugger-t10
    "T20",   # https://docs.astral.sh/ruff/rules/#flake8-print-t20
    "TID",   # https://docs.astral.sh/ruff/rules/#flake8-tidy-imports-tid
    "UP",    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "W",     # https://docs.astral.sh/ruff/rules/#warning-w
]

ignore = [
    "E501",  # line length exceeds limit: the formatter owns this
    "E741",  # ambiguous variable name
    "T201",  # print: the CLI's whole job is printing
    "T203",  # pprint
    "N818",  # exception names are deliberately descriptive, not Error-suffixed
    "G004",  # logging-f-string: f-strings are the house style for all formatting, including logging calls
    "D1",    # undocumented-*: docstrings are written where they add value (and never on modules, per house style)
    "D203",  # incompatible with D211 (no blank line before a class docstring)
    "D205",  # would force a single-physical-line summary
    "D212",  # incompatible with D213 (the multi-line summary belongs on the second line)
    "D401",  # non-imperative-mood: docstrings here are descriptive
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "SLF001",   # tests inspect internals deliberately
    "ASYNC110", # tests poll observed state with sleep loops; no event to await
    "ASYNC240", # tests assert against the real filesystem; a thread hop would only hide the assert
    "SIM117",   # nested `with` expresses resource scoping; flattening moves scoped asserts
]
