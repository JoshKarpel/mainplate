name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    # One platform, because nothing here is platform-specific yet and a single locked
    # environment is also a single toolchain: split across three runners, the legs would
    # spend more wall-clock checking out and syncing than they save by running in parallel.
    # The one thing that would justify a matrix is the SQLite the interpreter links against,
    # which differs per platform and has a floor this store needs (3.42, for `unixepoch`'s
    # `subsec`); when a test asserts that floor, this becomes a matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Run type checking and tests
        run: just test --cov --durations 20 -vvv
