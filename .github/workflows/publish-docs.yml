name: Publish Docs

# Build and deploy the documentation site to GitHub Pages from the default branch only.
# Pull-request builds are validated by the `docs` job in `ci.yml`, which runs the same recipe.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys so a newer publish never races a queued one, and never cancel one mid-flight:
# a half-uploaded Pages artifact is a site nobody asked for.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Docs to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
      pages: write # publish to GitHub Pages
      id-token: write # verify the deployment originates from this workflow
    environment: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain action is skipped here for the same reason the `docs` job in `ci.yml` skips
      # it: a site build needs neither the browser the suite drives nor the sandbox it confines
      # commands with.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build the documentation site
        run: just docs-build

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # Push only ever runs on main; this also guards a manual dispatch from another branch.
      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
